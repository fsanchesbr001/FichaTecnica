spring.profiles.active=${APP_PROFILE:development}
spring.application.name=FichaTecnicaApp

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

spring.datasource.url=jdbc:mysql://${DB_IP:localhost}:${DB_PORT:3306}/${DB_NAME:FichaTecnica}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PWD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


api.security.token.secret=${JWT_SECRET:F@br1c10S@nch3s}
api.security.token.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
api.security.token.time-zone=${JWT_TIME_ZONE:America/Sao_Paulo}

spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=20000

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.connection-init-sql=SET SESSION innodb_lock_wait_timeout=${DB_LOCK_WAIT_SECONDS:5}, lock_wait_timeout=${DB_LOCK_WAIT_SECONDS:5}

# Caminho base para armazenamento no droplet DigitalOcean
digitalocean.storage.base-path=${DO_STORAGE_PATH:/olivander/ficha_tecnica/imagens}

app.storage.image-upload-dir=${IMAGE_UPLOAD_DIR:${digitalocean.storage.base-path}}

# Tamanho maximo do arquivo (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Serve imagens localmente usando a base configurada por profile/ambiente
spring.web.resources.static-locations=classpath:/static/,file:${digitalocean.storage.base-path}/
spring.mvc.static-path-pattern=/uploads/**

