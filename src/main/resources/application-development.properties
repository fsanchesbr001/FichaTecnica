spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PWD:root}
spring.datasource.url=jdbc:mysql://${DB_IP:localhost}:${DB_PORT:3306}/${DB_NAME:FichaTecnica}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

site.origin.allowed=http://localhost:4200

# Caminho base para armazenamento local de uploads no desenvolvimento
digitalocean.storage.base-path=${LOCAL_STORAGE_PATH:/storage/uploads}
digitalocean.storage.public-url=http://localhost:8080/uploads
app.storage.image-upload-dir=${IMAGE_UPLOAD_DIR:C:/temp/fichatecnica/imagens}

# Servir os arquivos salvos no diret�rio local como conte�do est�tico
spring.web.resources.static-locations=classpath:/static/,file:${digitalocean.storage.base-path}/
spring.mvc.static-path-pattern=/uploads/**

# Tamanho m�ximo do arquivo (50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

