name: Backend CI/CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: fichatecnica-backend

jobs:
  build-test-and-push:
    name: Build, Test and Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Mantem build e testes do backend com cache Maven para acelerar a pipeline.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test with Maven
        run: mvn -B -ntp clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login no Docker Hub apenas em push/manual (não em pull_request).
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Gera tags padronizadas: latest e sha-<commit>.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      # Builda sempre; faz push apenas quando não for PR.
      - name: Build and (optionally) push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: build-test-and-push
    if: |
      needs.build-test-and-push.result == 'success' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy production Compose file to DigitalOcean
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ${{ secrets.DO_PROJECT_DIR || '/opt/fichatecnica' }}
          overwrite: true

      # Deploy remoto via SSH com restart do docker-compose de produção.
      - name: Deploy on DigitalOcean droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          DO_PROJECT_DIR: ${{ secrets.DO_PROJECT_DIR }}
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_PWD: ${{ secrets.MAIL_PWD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          SYSTEM_PWD: ${{ secrets.SYSTEM_PWD }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,DOCKER_IMAGE,DO_PROJECT_DIR,APP_ENV_FILE,JWT_SECRET,MAIL_PWD,MYSQL_PASSWORD,MYSQL_ROOT_PASSWORD,SYSTEM_PWD
          script_stop: true
          script: |
            set -e

            # Resolve caminho do projeto com fallback seguro.
            PROJECT_DIR="${DO_PROJECT_DIR:-/opt/fichatecnica}"
            TARGET_BACKEND_IMAGE="$DOCKER_IMAGE:sha-${{ github.sha }}"

            # Valida secrets obrigatorios para evitar deploy com configuracao incompleta.
            REQUIRED_VARS="DOCKER_USERNAME DOCKER_PASSWORD JWT_SECRET MAIL_PWD MYSQL_PASSWORD MYSQL_ROOT_PASSWORD SYSTEM_PWD"
            for var_name in $REQUIRED_VARS; do
              eval "var_value=\${$var_name}"
              if [ -z "$var_value" ]; then
                echo "Erro: secret/variavel obrigatoria ausente: $var_name" >&2
                exit 1
              fi
            done

            # a) Login no Docker Hub para garantir acesso ao pull.
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            # Detecta automaticamente docker compose (plugin) ou docker-compose (binario legado).
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Erro: docker compose/docker-compose nao encontrado no servidor." >&2
              exit 1
            fi

            # b) Valida pasta/arquivos do projeto e injeta os secrets em arquivos mapeados.
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Erro: diretorio do projeto nao encontrado: $PROJECT_DIR" >&2
              exit 1
            fi

            cd "$PROJECT_DIR"

            if [ ! -f "docker-compose.prod.yml" ]; then
              echo "Erro: arquivo docker-compose.prod.yml nao encontrado em $PROJECT_DIR" >&2
              exit 1
            fi

            mkdir -p docker/secrets

            if [ -n "$APP_ENV_FILE" ]; then
              printf '%s\n' "$APP_ENV_FILE" > .env
            fi
            printf '%s' "$JWT_SECRET" > docker/secrets/jwt_secret.txt
            printf '%s' "$MAIL_PWD" > docker/secrets/mail_pwd.txt
            printf '%s' "$MYSQL_PASSWORD" > docker/secrets/mysql_password.txt
            printf '%s' "$MYSQL_ROOT_PASSWORD" > docker/secrets/mysql_root_password.txt
            printf '%s' "$SYSTEM_PWD" > docker/secrets/system_pwd.txt

            # Persiste o backend image imutavel por SHA para o docker-compose.prod.yml.
            if [ -f ".env" ]; then
              grep -v '^BACKEND_IMAGE=' .env > .env.tmp || true
              mv .env.tmp .env
            fi
            printf 'BACKEND_IMAGE=%s\n' "$TARGET_BACKEND_IMAGE" >> .env

            # c) Download da imagem nova (latest e tag por commit).
            docker pull "$DOCKER_IMAGE:latest"
            docker pull "$TARGET_BACKEND_IMAGE"

            # Captura imagem atual para rollback rapido em caso de erro de health-check.
            PREVIOUS_BACKEND_IMAGE="$(docker inspect -f '{{.Config.Image}}' ficha-backend 2>/dev/null || true)"

            # d) Reinicia a aplicacao em producao.
            $COMPOSE_CMD -f docker-compose.prod.yml down
            $COMPOSE_CMD -f docker-compose.prod.yml up -d --no-build

            # Health-check pos-deploy com rollback automatico se backend nao subir saudavel.
            BACKEND_HEALTHY="false"
            for i in $(seq 1 30); do
              STATUS="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' ficha-backend 2>/dev/null || echo 'missing')"
              if [ "$STATUS" = "healthy" ]; then
                BACKEND_HEALTHY="true"
                break
              fi
              sleep 5
            done

            if [ "$BACKEND_HEALTHY" != "true" ]; then
              echo "Erro: backend nao ficou saudavel com a imagem nova. Iniciando rollback..." >&2
              if [ -n "$PREVIOUS_BACKEND_IMAGE" ]; then
                grep -v '^BACKEND_IMAGE=' .env > .env.tmp || true
                mv .env.tmp .env
                printf 'BACKEND_IMAGE=%s\n' "$PREVIOUS_BACKEND_IMAGE" >> .env
                $COMPOSE_CMD -f docker-compose.prod.yml down
                $COMPOSE_CMD -f docker-compose.prod.yml up -d --no-build
                echo "Rollback executado para: $PREVIOUS_BACKEND_IMAGE" >&2
              else
                echo "Rollback nao executado: imagem anterior nao encontrada." >&2
              fi
              exit 1
            fi

            # e) Limpa imagens antigas.
            docker image prune -a -f
